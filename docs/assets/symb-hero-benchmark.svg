<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="symbHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background glow circles -->
  <circle cx="200" cy="100" r="150" fill="#00f2fe" opacity="0.04" />
  <circle cx="800" cy="400" r="180" fill="#a855f7" opacity="0.05" />

  <!-- Title Badge -->
  <rect x="40" y="30" width="920" height="70" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="60" y="65" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="1">⚡ SYMB vs TRADITIONAL REVERSE ENGINEERING SUITES</text>
  <text x="60" y="86" fill="#94a3b8" font-size="13" font-weight="500">Benchmark Matrix • Zero-Dependency High-Speed Decompiler &amp; SMT Symbolic Engine</text>

  <rect x="800" y="45" width="140" height="34" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="870" y="67" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">100% SPEC VERIFIED</text>

  <!-- Table Container -->
  <rect x="40" y="115" width="920" height="375" rx="12" fill="#0c1220" stroke="#1e293b" stroke-width="1.5" />

  <!-- Column Headers -->
  <rect x="40" y="115" width="920" height="50" rx="12" fill="#141e33" />
  <text x="70" y="146" fill="#64748b" font-size="13" font-weight="700">ANALYSIS CAPABILITY</text>
  <text x="360" y="146" fill="#00f2fe" font-size="14" font-weight="800">⚡ SYMB (SOVEREIGN)</text>
  <text x="560" y="146" fill="#94a3b8" font-size="13" font-weight="700">morluto/rea</text>
  <text x="720" y="146" fill="#94a3b8" font-size="13" font-weight="700">Ghidra (NSA)</text>
  <text x="860" y="146" fill="#94a3b8" font-size="13" font-weight="700">Jadx / Apktool</text>

  <!-- Row 1: Execution Speed -->
  <g transform="translate(0, 165)">
    <rect x="40" y="0" width="920" height="52" fill="#0c1220" />
    <rect x="340" y="4" width="190" height="44" rx="8" fill="url(#symbHighlight)" stroke="#10b981" stroke-width="1" />
    <text x="70" y="31" fill="#e2e8f0" font-size="13" font-weight="600">Decompilation Speed</text>
    <text x="70" y="43" fill="#64748b" font-size="10">PE/ELF / 33MB Android APK</text>
    <text x="360" y="31" fill="#34d399" font-size="14" font-weight="700">&lt; 40ms / 3.2s</text>
    <text x="560" y="31" fill="#94a3b8" font-size="13">4.8s+ / ~15s</text>
    <text x="720" y="31" fill="#f43f5e" font-size="13">22.5s (Heavy JVM)</text>
    <text x="860" y="31" fill="#f43f5e" font-size="13">14.2s (JVM Shell)</text>
    <line x1="40" y1="52" x2="960" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Row 2: Runtime Dependencies -->
  <g transform="translate(0, 217)">
    <rect x="40" y="0" width="920" height="52" fill="#0f172a" />
    <rect x="340" y="4" width="190" height="44" rx="8" fill="url(#symbHighlight)" stroke="#10b981" stroke-width="1" />
    <text x="70" y="31" fill="#e2e8f0" font-size="13" font-weight="600">Runtime Dependencies</text>
    <text x="70" y="43" fill="#64748b" font-size="10">External runtimes or tools</text>
    <text x="360" y="31" fill="#34d399" font-size="13" font-weight="700">Zero (Native In-Memory)</text>
    <text x="560" y="31" fill="#f59e0b" font-size="13">Java + Jadx + Apktool</text>
    <text x="720" y="31" fill="#f43f5e" font-size="13">1.2GB Java Runtime</text>
    <text x="860" y="31" fill="#f43f5e" font-size="13">Java JRE + Dalvik</text>
    <line x1="40" y1="52" x2="960" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Row 3: Android APK 5-Pass Suite -->
  <g transform="translate(0, 269)">
    <rect x="40" y="0" width="920" height="52" fill="#0c1220" />
    <rect x="340" y="4" width="190" height="44" rx="8" fill="url(#symbHighlight)" stroke="#10b981" stroke-width="1" />
    <text x="70" y="31" fill="#e2e8f0" font-size="13" font-weight="600">Android APK Decompiler</text>
    <text x="70" y="43" fill="#64748b" font-size="10">v1/v2/v3 Signatures + Secrets + JNI</text>
    <text x="360" y="31" fill="#34d399" font-size="13" font-weight="700">5-Pass Multi-Stage AST</text>
    <text x="560" y="31" fill="#94a3b8" font-size="13">CLI Wrapper (Jadx)</text>
    <text x="720" y="31" fill="#f43f5e" font-size="13">Partial Plugin</text>
    <text x="860" y="31" fill="#94a3b8" font-size="13">Java Only (No SMT)</text>
    <line x1="40" y1="52" x2="960" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Row 4: Apple iOS IPA & Mach-O -->
  <g transform="translate(0, 321)">
    <rect x="40" y="0" width="920" height="52" fill="#0f172a" />
    <rect x="340" y="4" width="190" height="44" rx="8" fill="url(#symbHighlight)" stroke="#10b981" stroke-width="1" />
    <text x="70" y="31" fill="#e2e8f0" font-size="13" font-weight="600">Apple iOS IPA Analysis</text>
    <text x="70" y="43" fill="#64748b" font-size="10">FairPlay DRM + Anti-Jailbreak</text>
    <text x="360" y="31" fill="#34d399" font-size="13" font-weight="700">ARM64 Mach-O &amp; Plist</text>
    <text x="560" y="31" fill="#64748b" font-size="13">Limited (CLI Tools)</text>
    <text x="720" y="31" fill="#94a3b8" font-size="13">Mach-O Disasm Only</text>
    <text x="860" y="31" fill="#64748b" font-size="13">Unsupported</text>
    <line x1="40" y1="52" x2="960" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Row 5: SMT & OLLVM Deobfuscation -->
  <g transform="translate(0, 373)">
    <rect x="40" y="0" width="920" height="52" fill="#0c1220" />
    <rect x="340" y="4" width="190" height="44" rx="8" fill="url(#symbHighlight)" stroke="#10b981" stroke-width="1" />
    <text x="70" y="31" fill="#e2e8f0" font-size="13" font-weight="600">SMT Logic &amp; OLLVM Unflatten</text>
    <text x="70" y="43" fill="#64748b" font-size="10">Z3 Theorem Prover + CFF SMT</text>
    <text x="360" y="31" fill="#34d399" font-size="13" font-weight="700">Embedded Z3 Solver</text>
    <text x="560" y="31" fill="#64748b" font-size="13">Unsupported</text>
    <text x="720" y="31" fill="#64748b" font-size="13">Manual Scripting</text>
    <text x="860" y="31" fill="#64748b" font-size="13">Unsupported</text>
    <line x1="40" y1="52" x2="960" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Row 6: MCP Server Integration -->
  <g transform="translate(0, 425)">
    <rect x="40" y="0" width="920" height="52" fill="#0f172a" />
    <rect x="340" y="4" width="190" height="44" rx="8" fill="url(#symbHighlight)" stroke="#10b981" stroke-width="1" />
    <text x="70" y="31" fill="#e2e8f0" font-size="13" font-weight="600">Autonomous MCP Server</text>
    <text x="70" y="43" fill="#64748b" font-size="10">Claude Desktop &amp; Cursor Ready</text>
    <text x="360" y="31" fill="#34d399" font-size="13" font-weight="700">12 Native MCP Tools</text>
    <text x="560" y="31" fill="#94a3b8" font-size="13">MCP Server</text>
    <text x="720" y="31" fill="#64748b" font-size="13">No MCP Interface</text>
    <text x="860" y="31" fill="#64748b" font-size="13">No MCP Interface</text>
  </g>
</svg>
