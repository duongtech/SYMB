<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00d4aa" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1f293d" stroke-width="2"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#00f5ff" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="420" y1="0" x2="420" y2="360" />
    <line x1="540" y1="0" x2="540" y2="360" />
    <line x1="660" y1="0" x2="660" y2="360" />
    <line x1="780" y1="0" x2="780" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1020" y1="0" x2="1020" y2="360" />
    <line x1="1140" y1="0" x2="1140" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Symbolic Graph Node Visuals -->
  <g transform="translate(860, 45)" opacity="0.9">
    <circle cx="150" cy="50" r="28" fill="#0e1726" stroke="#00f5ff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="150" y="55" fill="#00f5ff" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle">ENTRY_LOC</text>
    
    <circle cx="60" cy="150" r="26" fill="#0e1726" stroke="#00d4aa" stroke-width="2" />
    <text x="60" y="155" fill="#00d4aa" font-family="Courier New, monospace" font-size="11" font-weight="bold" text-anchor="middle">BB_FEAT_A</text>
    
    <circle cx="240" cy="150" r="26" fill="#0e1726" stroke="#c084fc" stroke-width="2" />
    <text x="240" y="155" fill="#c084fc" font-family="Courier New, monospace" font-size="11" font-weight="bold" text-anchor="middle">BB_FEAT_B</text>
    
    <circle cx="150" cy="245" r="30" fill="#0e1726" stroke="#00f5ff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="150" y="250" fill="#00f5ff" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle">SAT_TARGET</text>

    <!-- Connectors -->
    <path d="M130 72 L80 128" stroke="#00d4aa" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M170 72 L220 128" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M78 172 L130 225" stroke="#00f5ff" stroke-width="2" />
    <path d="M222 172 L170 225" stroke="#00f5ff" stroke-width="2" />
  </g>

  <!-- Header text -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="136" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="68" y="17" fill="#38bdf8" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OFFICIAL MCP</text>

    <text x="0" y="85" fill="url(#text-grad)" font-family="Segoe UI, -apple-system, sans-serif" font-size="62" font-weight="900" letter-spacing="2">SYMB</text>
    <text x="230" y="85" fill="#94a3b8" font-family="Courier New, monospace" font-size="24" font-weight="400">// agents</text>

    <text x="0" y="128" fill="#e2e8f0" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="600">
      Symbolic Execution, Automated Deobfuscation &amp; SMT Solving
    </text>

    <text x="0" y="160" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="15">
      The authoritative MCP server for autonomous binary solving, OLLVM CFG unflattening, and zero-disk memory trampolines.
    </text>

    <!-- Badges pill -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#00d4aa" stroke-width="1.5" />
      <circle cx="18" cy="16" r="5" fill="#00d4aa" />
      <text x="32" y="21" fill="#f1f5f9" font-family="Courier New, monospace" font-size="12" font-weight="bold">Z3 SMT SOLVER</text>

      <rect x="175" y="0" width="180" height="32" rx="8" fill="#0f172a" stroke="#00f5ff" stroke-width="1.5" />
      <circle cx="193" cy="16" r="5" fill="#00f5ff" />
      <text x="207" y="21" fill="#f1f5f9" font-family="Courier New, monospace" font-size="12" font-weight="bold">OLLVM UNFLATTEN</text>

      <rect x="370" y="0" width="195" height="32" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <circle cx="388" cy="16" r="5" fill="#c084fc" />
      <text x="402" y="21" fill="#f1f5f9" font-family="Courier New, monospace" font-size="12" font-weight="bold">ZERO-DISK HOOKS</text>
    </g>
  </g>
</svg>