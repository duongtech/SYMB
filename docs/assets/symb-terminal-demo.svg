      <text x="40" y="145" fill="#f8fafc">        }</text>
      <text x="40" y="165" fill="#f43f5e">        return;</text>
      <text x="20" y="185" fill="#f8fafc">    }</text>
      <text x="0" y="205" fill="#f8fafc">}</text>
