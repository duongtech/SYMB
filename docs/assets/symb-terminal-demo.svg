<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="580">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="960" height="540" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Titlebar -->
  <path d="M 20 32 Q 20 20 32 20 L 968 20 Q 980 20 980 32 L 980 58 L 20 58 Z" fill="#111827"/>
  <circle cx="48" cy="39" r="6" fill="#ef4444"/>
  <circle cx="68" cy="39" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="39" r="6" fill="#10b981"/>
  <text x="500" y="44" fill="#94a3b8" font-family="Courier New, monospace" font-size="13" font-weight="600" text-anchor="middle">symb-agent-session :: z3-solver-engine</text>

  <!-- Terminal Content -->
  <g transform="translate(45, 90)" font-family="Courier New, monospace" font-size="13.5" xml:space="preserve">
    <!-- Prompt 1 -->
    <text x="0" y="0" fill="#38bdf8" font-weight="bold">user@claude-code:~$</text>
    <text x="180" y="0" fill="#f8fafc">npx symb-agents setup --client claude-code</text>

    <!-- Output 1 -->
    <text x="0" y="26" fill="#10b981">[ok] SYMB MCP registered in ~/.claude/config.json</text>
    <text x="0" y="48" fill="#64748b">---</text>

    <!-- Prompt 2: Agent Action -->
    <text x="0" y="74" fill="#a855f7" font-weight="bold">Claude Code &gt;</text>
    <text x="135" y="74" fill="#e2e8f0">Analyzing target binary: libcore_security.so (OLLVM Flattened)</text>
    
    <text x="0" y="104" fill="#00d4aa">▶ mcp.call("unflatten_cfg", {</text>
    <text x="20" y="126" fill="#94a3b8">  "binary_path": "libcore_security.so",</text>
    <text x="20" y="148" fill="#94a3b8">  "function_address": "0x4012A0",</text>
    <text x="20" y="170" fill="#94a3b8">  "arch": "x86_64"</text>
    <text x="0" y="192" fill="#00d4aa">})</text>

    <text x="0" y="222" fill="#38bdf8">[SYMB_CORE] Dissecting state variable switch dispatcher at 0x4012A0...</text>
    <text x="0" y="244" fill="#f1f5f9">[SYMB_CORE] Detected state var: [rbp-0x18] | Recovered 14 relevant basic blocks</text>
    <text x="0" y="266" fill="#f1f5f9">[SYMB_CORE] Eliminating 38 bogus switch edges... Linear CFG synthesized!</text>
    <text x="0" y="288" fill="#10b981">✔ Unflattening status: SUCCESS (Recovered branch: 0x4014F2 -> 0x401620)</text>

    <!-- Prompt 3: SMT Solve -->
    <text x="0" y="322" fill="#00d4aa">▶ mcp.call("solve_branch_constraints", {</text>
    <text x="20" y="344" fill="#94a3b8">  "target_address": "0x401620",</text>
    <text x="20" y="366" fill="#94a3b8">  "symbolic_variables": ["license_key", "checksum"]</text>
    <text x="0" y="388" fill="#00d4aa">})</text>

    <text x="0" y="416" fill="#38bdf8">[Z3_SOLVER] Constructing bit-vector AST: 128-bit nonlinear equation set</text>
    <text x="0" y="438" fill="#10b981">✔ Z3 Status: SAT (Solved in 38.4ms) | Confidence: 1.00</text>
    <text x="0" y="460" fill="#f59e0b">★ Concrete Solution: license_key = "SYMB-7F89-A2C4-9981" (Checksum: 0xDEADBEEF)</text>
  </g>
</svg>