      <tspan fill="#34d399" font-weight="700">user@agent-node</tspan><tspan fill="#64748b">:</tspan><tspan fill="#60a5fa">~/SYMB</tspan><tspan fill="#f8fafc">$ </tspan><tspan fill="#34d399">█</tspan>
