      <text x="0" y="25" fill="#f43f5e">public class <tspan fill="#38bdf8">HelpActivity</tspan> <tspan fill="#f43f5e">extends</tspan> <tspan fill="#38bdf8">android.app.Activity</tspan> {</text>
      <text x="20" y="45" fill="#f43f5e">    public void <tspan fill="#60a5fa">onCreate</tspan>() {</text>
      <text x="40" y="65" fill="#f8fafc">        <tspan fill="#38bdf8">StringBuilder</tspan> v1 = <tspan fill="#f43f5e">new</tspan> <tspan fill="#38bdf8">StringBuilder</tspan>();</text>
      <text x="40" y="85" fill="#f8fafc">        v1.<tspan fill="#60a5fa">append</tspan>(<tspan fill="#a3e635">"https://termux.dev/en/"</tspan>);</text>
      <text x="40" y="105" fill="#f43f5e">        if <tspan fill="#f8fafc">(v0 != 0) {</tspan></text>
