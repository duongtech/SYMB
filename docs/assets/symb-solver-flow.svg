<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="380">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="380" rx="14" fill="url(#flow-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="550" y="45" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    SYMB Autonomous Binary Solving &amp; Deobfuscation Flow
  </text>
  <text x="550" y="70" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">
    How AI Agents interact with the local Symbolic Execution Engine via Standard MCP
  </text>

  <!-- Step 1: Agent Layer -->
  <g transform="translate(60, 110)">
    <rect width="210" height="190" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="36" rx="10" fill="#1e293b"/>
    <text x="105" y="24" fill="#38bdf8" font-family="Courier New, monospace" font-size="13" font-weight="bold" text-anchor="middle">1. AI AGENT LAYER</text>

    <text x="20" y="70" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">• Claude Code</text>
    <text x="20" y="95" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">• Cursor / Windsurf</text>
    <text x="20" y="120" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">• Antigravity / Gemini</text>
    <text x="20" y="145" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">• Autonomous Reverser</text>

    <text x="105" y="180" fill="#94a3b8" font-family="Courier New, monospace" font-size="11" text-anchor="middle">JSON-RPC 2.0 (stdio)</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 270 205 L 340 205" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="340,205 330,199 330,211" fill="#38bdf8"/>

  <!-- Step 2: MCP Bridge -->
  <g transform="translate(345, 110)">
    <rect width="210" height="190" rx="10" fill="#111827" stroke="#00d4aa" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="36" rx="10" fill="#1e293b"/>
    <text x="105" y="24" fill="#00d4aa" font-family="Courier New, monospace" font-size="13" font-weight="bold" text-anchor="middle">2. SYMB MCP SERVER</text>

    <text x="20" y="70" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12">• Zod Contract Schema</text>
    <text x="20" y="95" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12">• Python Child Bridges</text>
    <text x="20" y="120" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12">• Sandbox &amp; Timeouts</text>
    <text x="20" y="145" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12">• Canonical SymbEvidence</text>

    <text x="105" y="180" fill="#00d4aa" font-family="Courier New, monospace" font-size="11" text-anchor="middle">Zero-Disk Isolation</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 555 205 L 625 205" stroke="#00d4aa" stroke-width="2.5"/>
  <polygon points="625,205 615,199 615,211" fill="#00d4aa"/>

  <!-- Step 3: Engine Cores -->
  <g transform="translate(630, 95)">
    <rect width="210" height="220" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="36" rx="10" fill="#1e293b"/>
    <text x="105" y="24" fill="#c084fc" font-family="Courier New, monospace" font-size="13" font-weight="bold" text-anchor="middle">3. SOLVER ENGINES</text>

    <text x="20" y="65" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Z3 SMT Solver Core</text>
    <text x="20" y="85" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Bit-vector constraint sat</text>

    <text x="20" y="115" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">OLLVM CFG Recovery</text>
    <text x="20" y="135" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Switch dispatcher defeat</text>

    <text x="20" y="165" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">Zero-Disk Trampolines</text>
    <text x="20" y="185" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">VirtualProtect in-mem hook</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 840 205 L 900 205" stroke="#a855f7" stroke-width="2.5"/>
  <polygon points="900,205 890,199 890,211" fill="#a855f7"/>

  <!-- Step 4: Targets -->
  <g transform="translate(905, 110)">
    <rect width="140" height="190" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="36" rx="10" fill="#1e293b"/>
    <text x="70" y="24" fill="#f59e0b" font-family="Courier New, monospace" font-size="12" font-weight="bold" text-anchor="middle">TARGETS</text>

    <text x="15" y="65" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• ELF / Linux</text>
    <text x="15" y="88" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• PE / Windows</text>
    <text x="15" y="111" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• Mach-O / macOS</text>
    <text x="15" y="134" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• APK / SO native</text>
    <text x="15" y="157" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• WASM / EVM</text>
  </g>
</svg>