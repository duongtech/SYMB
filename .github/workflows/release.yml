name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Solvers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install z3-solver angr unicorn capstone

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          scope: '@duongtech'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript & Bundles
        run: npm run build

      - name: Run Full 6-Stage Verification Suite
        run: npm test

      - name: Pack Distribution Bundles
        run: |
          mkdir -p release-dist
          npm pack --pack-destination release-dist/
          tar -czf release-dist/symb-${{ github.ref_name }}-full.tar.gz dist/ scripts/ src/ README.md LICENSE package.json
          zip -r release-dist/symb-${{ github.ref_name }}-full.zip dist/ scripts/ src/ README.md LICENSE package.json

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SYMB Titan ${{ github.ref_name }} — Autonomous Symbolic Execution & Decompiler Engine"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*
          body: |
            # 🚀 SYMB Titan ${{ github.ref_name }}

            **Production-Grade Symbolic Reverse Engineering, Deobfuscation & Constraint Solving for AI Agents.**
            One autonomous MCP server and CLI for OLLVM unflattening, Z3 SMT constraint solving, binary reachability, multi-platform decompilation (PE, ELF, APK, iOS IPA), and large media buffer optimization.

            ---

            ### 🌟 Key Highlights & Architectural Capabilities

            1. **15 Native MCP Tools Spec-Compliant**:
               - `optimize_large_media_buffer`: High-capacity media & raw binary buffer processor for AI Agents (FFmpeg audio extraction, video downsampling, and zero-RAM `mmap` binary streaming).
               - `decompile_entire_program` & `decompile_native_function`: High-speed native x86/x64 C pseudocode lifting with PLT/IAT stub resolution.
               - `decompile_apk_package`: 5-pass Dalvik/DEX decompiler reconstructing readable Java class structures.
               - `decompile_ios_ipa_package`: iOS Mach-O IPA extractor with FairPlay DRM cryptid detection and anti-jailbreak auditing.
               - `unflatten_control_flow`: Automated OLLVM Control Flow Flattening (CFF) dispatcher bypass and basic block unscrambler across PE & ELF.
               - `solve_branch_reachability`: SMT constraint solver calculating valid inputs to reach deep binary code branches.
               - `trace_symbolic_taint`: Inter-procedural symbolic taint tracker from sources to security sinks.
               - `detect_binary_protections`: Static anti-debug, anti-hook, and timing trap detector with heuristic risk scoring.
               - `decrypt_obfuscated_strings`: Automated rolling XOR and multi-layer encoded string recovery.
               - `detect_crypto_primitives`: Cryptographic S-box, AES/DES tables, and constant scanner.
               - `scan_byte_entropy`: 256-byte sliding window Shannon entropy heatmap for cryptor/packer identification.
               - `trace_binary_xrefs`: Whole-binary call graph and string cross-reference resolver.
               - `inspect_binary_layout`: Multi-format header and section analyzer (PE, ELF, Mach-O, DEX).
               - `hot_patch_live_memory`: Process memory patcher with trampoline generation.

            2. **Pure Mathematical Rigor**:
               - Integrated with **Z3 Theorem Prover 5.3.1**, **angr 10.0.5**, **Unicorn 2.1.4**, and **Capstone 5.0.7**.

            3. **Installation & Quick Start**:
               ```bash
               # Install CLI globally
               npm install -g symb-agents

               # Run automated environment setup
               symb setup

               # Audit local solver capabilities
               symb audit

               # Optimize large videos/buffers for AI Agents
               symb optimize-media <video.mp4> --target-mb 50
               ```

            ---

            ### 📦 Release Assets
            - Standalone NPM package tarball (`.tgz`)
            - Full source and pre-compiled engine bundle (`.tar.gz` and `.zip`)
            - 100% verified across 6 comprehensive verification test suites.

      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          npm publish --registry=https://npm.pkg.github.com/ --access public || true

      - name: Publish to NPM Registry (if NPM_TOKEN configured)
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
          npm publish --access public || true
