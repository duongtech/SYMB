name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build, Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install System Dependencies & Solvers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript & Bundles
        run: npm run build

      - name: Run Full 8-Stage Verification Suite & Vitest
        run: npm test

      - name: Pack Distribution Bundles
        run: |
          mkdir -p release-dist
          npm pack --pack-destination release-dist/
          tar -czf release-dist/symb-${{ github.ref_name }}-full.tar.gz dist/ scripts/ src/ README.md LICENSE package.json requirements.txt
          zip -r release-dist/symb-${{ github.ref_name }}-full.zip dist/ scripts/ src/ README.md LICENSE package.json requirements.txt

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SYMB Titan ${{ github.ref_name }} — Autonomous Symbolic Execution & Active Binary Intervention Engine"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*
          body: |
            # 🚀 SYMB Titan ${{ github.ref_name }} — Major Architectural Release

            **Production-Grade Symbolic Reverse Engineering, Deobfuscation & Active Binary Intervention for AI Agents.**
            One autonomous MCP server and CLI for OLLVM unflattening, Z3 SMT constraint solving, binary reachability, multi-platform decompilation (PE, ELF, APK, iOS IPA), dynamic binary patching, anti-debug neutralization, and large media buffer optimization.

            ---

            ### ⚔️ What's New in v2.0.0: Active Binary Intervention Arsenal (Surpassing Passive RE Tools)
            Mainstream reverse engineering assistants (such as REA) remain passive observers that refuse to modify binaries or bypass security controls. SYMB v2.0.0 introduces automated active binary intervention:

            1. **`patch_binary_executable`**: Surgical disk binary patcher with RVA-to-Raw conversion, arbitrary hex byte modification, automatic backup creation, and automated PE CheckSum recalculation.
            2. **`neutralize_anti_debugging`**: Proactive anti-debug eliminator that scans and NOPs out inline RDTSC timing traps, INT 2D/3 traps, and PEB `BeingDebugged` checks on disk.
            3. **`bypass_license_authorization`**: SMT-assisted license logic analyzer that computes branch condition inversions (`JE` <-> `JNE`, force `JMP`) and outputs patched binaries.
            4. **`generate_frida_instrumentation`**: Automated Frida script synthesizer for Universal Android SSL Unpinning, RootBeer cloaking, and Windows native API hooks.
            5. **`hot_patch_live_memory`**: Atomic zero-disk memory trampolines via Win32 VirtualProtectEx / Linux `/proc/pid/mem`.

            ---

            ### 🌟 Key Highlights & Full Catalog (20 Native MCP Tools)

            1. **Active Binary Intervention**:
               - `neutralize_anti_debugging`, `bypass_license_authorization`, `patch_binary_executable`, `generate_frida_instrumentation`, `hot_patch_live_memory`
            2. **Symbolic Deobfuscation & SMT Solvers**:
               - `unflatten_control_flow`: Automated OLLVM Control Flow Flattening (CFF) dispatcher bypass and basic block unscrambler across PE & ELF.
               - `solve_branch_reachability`: SMT constraint solver calculating valid inputs to reach deep binary code branches.
               - `trace_symbolic_taint`: Inter-procedural symbolic taint tracker from sources to security sinks.
            3. **Multi-Platform Decompilers & Unpackers**:
               - `dynamically_unpack_binary`: Unicorn CPU emulation unpacker with OEP tail jump detection.
               - `decompile_entire_program` & `decompile_native_function`: High-speed native x86/x64 C pseudocode lifting with PLT/IAT stub resolution.
               - `decompile_apk_package`: 5-pass Dalvik/DEX decompiler reconstructing readable Java class structures.
               - `decompile_ios_ipa_package`: iOS Mach-O IPA extractor with FairPlay DRM cryptid detection and anti-jailbreak auditing.
            4. **Deep Binary Auditing & Buffers**:
               - `detect_binary_protections`: Static anti-debug, anti-hook, and timing trap detector with heuristic risk scoring.
               - `decrypt_obfuscated_strings`: Automated rolling XOR and multi-layer encoded string recovery.
               - `detect_crypto_primitives`: Cryptographic S-box, AES/DES tables, and constant scanner.
               - `scan_byte_entropy`: 256-byte sliding window Shannon entropy heatmap for cryptor/packer identification.
               - `trace_binary_xrefs`: Whole-binary call graph and string cross-reference resolver.
               - `inspect_binary_layout`: Multi-format header and section analyzer (PE, ELF, Mach-O, DEX).
               - `optimize_large_media_buffer`: High-capacity media & raw binary buffer processor for AI Agents (FFmpeg audio extraction, video downsampling, and zero-RAM `mmap` binary streaming).

            ---

            ### 🧪 Verification & Evidence Contracts
            - **100% Pass** across 4 Vitest unit/integration test suites and 8 comprehensive verification runner suites.
            - Full canonical **SymbEvidence** contracts with Target Identity (SHA-256, MD5 digests), Engine Provenance, and fail-closed safety.

      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("./package.json", "utf8"));
            if (!pkg.name.startsWith("@")) {
              pkg.name = "@duongtech/" + pkg.name;
              fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2));
            }
          '
          npm publish --registry=https://npm.pkg.github.com/ --access public || true

      - name: Publish to NPM Registry (if NPM_TOKEN configured)
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
          npm publish --access public || true
